<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação de Palavras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="jogo">
        <h1>Jogo de Adivinhação de Palavras</h1>
        <p>Tente descobrir qual é a palavra secreta!</p>

        <p id="palavra">_ _ _ _ _</p>

        <p>
            Tentativas restantes:
            <span id="tentativas">6</span>
        </p>

        <label for="letra">Digite uma letra:</label>
        <input id="letra" type="text" maxlength="1" autocomplete="off">

        <button id="btn-tentar">Tentar</button>

        <p id="mensagem"></p>

        <p>
            Letras utilizadas:
            <span id="letras-usadas">Nenhuma ainda</span>
        </p>

        <p>
            Quantidade de letras usadas:
            <span id="contador-letras">0</span>
        </p>

        <button id="btn-reiniciar">Nova partida</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
